packages:
  - packages/*
  - examples/maps-demo
nodeLinker: hoisted
pnpmfile:
  - node_modules/.pnpm-config/miaoda-expo-devkit/pnpmfile.cjs
sharedWorkspaceLockfile: false
publicHoistPattern:
  - "@babel/*"
  - "@expo/config-plugins"
catalog:
  react: 19.2.0
  react-dom: 19.2.0
  react-native: 0.83.2
  react-native-reanimated: 4.2.1
  react-native-web: ~0.21.0
  react-native-css-interop: 0.2.7
  nativewind: 4.2.7
  expo: 55.0.6
  expo-build-properties: ~55.0.9
  expo-video: 55.0.5
  expo-blur: ~55.0.9
  expo-image: ~55.0.11
  expo-linear-gradient: ~55.0.8
  expo-calendar: ~55.0.7
  expo-media-library: ~55.0.15
  expo-notifications: ~55.0.12
  expo-image-picker: ~55.0.19
  expo-camera: ~55.0.18
  expo-file-system: ~55.0.17
  expo-contacts: ~55.0.14
  expo-haptics: ~55.0.14
  expo-router: 55.0.5
  "@expo/metro-runtime": 55.0.12
  babel-preset-expo: 55.0.25
  "@sentry/react-native": 8.9.2
  "@biomejs/biome": ^2.4.12
  oxlint: ^1.60.0
  typescript: ~5.9.2
minimumReleaseAgeExclude:
  - miaoda-expo-devkit
  - miaoda-expo-dev-client-55
  - miaoda-expo-dev-launcher-55
  - miaoda-expo-dev-menu-55
  - miaoda-expo-dev-menu-interface-55
  - miaoda-expo-native-capabilities
allowUnusedPatches: true
packageExtensions:
  "@react-native-async-storage/expo-with-async-storage@1.0.0":
    dependencies:
      "@expo/config-plugins": 55.0.11
  react-native-gifted-charts:
    dependencies:
      expo-linear-gradient: ~55.0.8
  react-native-css-interop:
    dependencies:
      connect: ^3.7.0
  react-native-worklets@0.7.4:
    dependencies:
      "@babel/generator": 7.29.1
      "@babel/traverse": 7.29.0
      "@babel/types": 7.29.0
  react-native-worklets@0.7.2:
    dependencies:
      "@babel/generator": 7.29.1
      "@babel/traverse": 7.29.0
      "@babel/types": 7.29.0
  "@sentry/react-native@8.9.2":
    dependencies:
      promise: 8.3.0
overrides:
  expo-audio: 55.0.6
  expo-video: 55.0.5
  expo-speech-recognition: 3.1.3
  "@expo/log-box": 55.0.13
  "@expo/dom-webview": 55.0.6
  cacheable: 2.5.0
  "@cacheable/memory": 2.2.0
  metro-runtime: 0.83.3
allowBuilds:
  "@sentry/cli": set this to true or false
  "@shopify/react-native-skia": true
  better-sqlite3: true
  esbuild: true
strictDepBuilds: false
trustLockfile: true
lockfileIncludeTarballUrl: false
minimumReleaseAge: 1440
configDependencies:
  miaoda-expo-devkit: 0.1.1-beta.131
